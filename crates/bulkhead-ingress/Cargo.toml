[package]
name = "bulkhead-ingress"
version.workspace = true
description = "The HTTP ingress as a driver app: hyper and rustls outside the Bulkhead node, each request a call to the app owning its route"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "bulkhead-ingress"
path = "src/main.rs"

[dependencies]
bulkhead-sdk = { workspace = true, features = ["http"] }
bulkhead-native = { workspace = true, features = ["app", "tokio"] }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
ring = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `signal` though the driver handles none: the node turns it on whenever
# both are built together (cargo unifies features), and its driver makes a
# socket pair that `--profile ingress` must allow; on here too, the driver's
# own tests run the same binary as a release (DA2b's fix, 2026-11-21).
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "signal"] }
tokio-rustls = { workspace = true }

[dev-dependencies]
# Its integration tests run it as the node does, on a runtime of their own.
bulkhead-bundle = { workspace = true }
bulkhead-host = { workspace = true }
rcgen = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
