[package]
name = "bulkhead-egress"
version.workspace = true
description = "An app's outgoing HTTP outside the Bulkhead node: hyper and rustls over connections the node opens, one driver per app"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "bulkhead-egress"
path = "src/main.rs"

[dependencies]
bulkhead-sdk = { workspace = true }
bulkhead-native = { workspace = true, features = ["app", "tokio"] }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "sync"] }
tower-service = { workspace = true }

[dev-dependencies]
# Its integration tests run it as the node does, on a runtime of their own.
bulkhead-bundle = { workspace = true }
bulkhead-host = { workspace = true, features = ["egress"] }
ciborium = { workspace = true }
rcgen = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util"] }
tokio-rustls = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
