[package]
name = "bulkhead-resolve"
version.workspace = true
description = "Host names resolved outside the Bulkhead node: hickory-resolver over TCP streams the node opens to the configured nameservers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "bulkhead-resolve"
path = "src/main.rs"

[dependencies]
bulkhead-sdk = { workspace = true, features = ["net"] }
bulkhead-native = { workspace = true, features = ["app", "tokio"] }
futures-io = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
hickory-resolver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "sync"] }

[dev-dependencies]
# Its integration tests run it as the node does, on a runtime of their own.
bulkhead-bundle = { workspace = true }
bulkhead-host = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
