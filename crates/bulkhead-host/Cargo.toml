[package]
name = "bulkhead-host"
version.workspace = true
description = "Bulkhead host runtime: engine, instances, mailboxes and the callback loop"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = ["sql", "egress"]
# HTTP egress (`bulkhead:http-egress`): each app's requests checked and
# forwarded to its egress driver (`bulkhead-egress`, ROADMAP DA4), which
# runs HTTP and TLS outside the node. Without it, requests answer `Other`.
egress = ["dep:http", "dep:rustls-native-certs"]
# SQL datasources (`bulkhead:sql`): each app's statements forwarded to its
# datasource's driver (`bulkhead-sql`, ROADMAP DA3), which runs Postgres's
# client outside the node.
sql = []
# USDT probes on the message path (`src/probe.rs`): SystemTap SDT on Linux,
# DTrace on macOS and FreeBSD, ETW on Windows. Without it the probe calls
# compile to nothing.
probes = ["dep:anyprobe"]
# In-process test apps (`bulkhead_host::in_process`, ROADMAP Z9c): apps
# written in Rust that run in their instance's task, for tests and the
# simulation. Not for production nodes.
test-apps = []

[dependencies]
anyprobe = { workspace = true, optional = true }
atomic-waker = { workspace = true }
bytes = { workspace = true }
ciborium = { workspace = true }
ciborium-ll = { workspace = true }
base64 = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-webpki = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
rustls-pki-types = { workspace = true }
bulkhead-bundle = { workspace = true }
bulkhead-keys = { workspace = true }
bulkhead-native = { workspace = true, features = ["channel"] }
bulkhead-priv-wire = { workspace = true }
redb = { workspace = true }
arc-swap = { workspace = true }
scc = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "process", "net"] }
tracing = { workspace = true }
rustls-native-certs = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["param", "pipe", "net", "fs"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# Its own in-process test apps, for its tests (`tests/in_process.rs`, the
# simulation).
bulkhead-host = { path = ".", features = ["test-apps"] }
rcgen = { workspace = true }
# The egress tests' HTTP and HTTPS servers.
tokio-rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
wat = { workspace = true }
tracing-subscriber = { workspace = true }
semver = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }

[[test]]
name = "egress"
required-features = ["egress"]

[lints]
workspace = true
