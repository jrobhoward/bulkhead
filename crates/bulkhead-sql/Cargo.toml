[package]
name = "bulkhead-sql"
version.workspace = true
description = "A Bulkhead datasource's Postgres client outside the node: a pool over connections the node opens, one driver per datasource"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "bulkhead-sql"
path = "src/main.rs"

[dependencies]
bulkhead-sdk = { workspace = true }
bulkhead-native = { workspace = true, features = ["app", "tokio"] }
bytes = { workspace = true }
deadpool = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "sync"] }
tokio-postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }

[dev-dependencies]
# Its integration tests run it as the node does, on a runtime of their own.
bulkhead-bundle = { workspace = true }
bulkhead-host = { workspace = true }
ciborium = { workspace = true }
rcgen = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
