[package]
name = "s37-driver-hyper"
version = "0.0.0"
edition = "2024"
publish = false

# Spike S41: DA1's driver with hyper and tokio inside it, calls through
# `bulkhead_native::sender_async`.
[dependencies]
bulkhead-sdk = { path = "../../../crates/bulkhead-sdk", features = ["http"] }
bulkhead-native = { path = "../../../crates/bulkhead-native", default-features = false, features = ["app", "tokio"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "net", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
