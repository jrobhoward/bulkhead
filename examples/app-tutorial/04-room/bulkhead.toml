# Chapter 4 of examples/app-tutorial: the room publishes to the group
# `chat` and calls and casts `history`.
[app]
name = "room"
version = "0.3.0"
description = "A chat room that publishes its posts (app tutorial, chapter 4)"

[appserver.limits]
memory_max = "32MiB"

[appserver.capabilities."bulkhead:logging"]

[appserver.capabilities."bulkhead:metrics"]
prefix = "room"

# The groups it may publish to (and join: none).
[appserver.capabilities."bulkhead:groups"]
publish = ["chat"]

# Whom its instances may send to.
[appserver.messaging_acl]
may_call = ["history"]
