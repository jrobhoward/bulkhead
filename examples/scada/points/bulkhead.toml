# The point table: a pool routed by device. The node's Modbus extension
# casts each device's updates here (`deliver_to = "points"`), and each
# instance writes them into the shared `points` bucket. Needs, in node
# config:
#
#   [buckets.points]
#   durability = "memory"
#
#   [extensions."bulkhead-modbus:modbus".devices.pump-1]
#   address = "10.0.0.5:502"
#   deliver_to = "points"
#   holding = [{ start = 0, count = 10 }]
#
# A typed value from registers it polls comes as a tag instead of those
# registers, stored under `pump-1/tag/<name>` (MANIFEST.md, Modbus):
#
#   [extensions."bulkhead-modbus:modbus".devices.pump-1.tags.flow]
#   table = "holding"
#   address = 4
#   type = "f32"            # registers 4 and 5
#   order = "cdab"          # the device's word order
#   deadband = 0.5          # send when it moves by 0.5 or more
#
# On an HA pair the table is one `cluster` bucket polled by the primary
# alone, so the standby's copy comes from it and has the same revisions:
#
#   [buckets.points]
#   durability = "disk"
#   scope = "cluster"
#
#   [extensions."bulkhead-modbus:modbus".devices.pump-1]
#   primary_only = true
#   ...
#
# and in policy: grant = ["bulkhead:logging", "bulkhead:keyvalue"],
# buckets = ["points"].
[app]
name = "points"
version = "1.0.0"
description = "Modbus point table in a shared bucket (bulkhead example)"
license = "MIT OR Apache-2.0"

[appserver.instances]
count = 4
routing = "hash:device"

[appserver.capabilities."bulkhead:logging"]

[appserver.capabilities."bulkhead:keyvalue".shared]
points = "rw"
