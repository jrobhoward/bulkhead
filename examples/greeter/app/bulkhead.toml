# Bundle with:
#   cargo build -p example-greeter-app --release
#   bulkhead bundle examples/greeter/app/bulkhead.toml target/release/example-greeter-app --key bulkhead.key
# Deploy the greeter (examples/greeter/service) first.
[app]
name = "greeted"
version = "1.0.0"
description = "Calls the greeter app (bulkhead example)"
license = "MIT OR Apache-2.0"

[[appserver.dependencies]]
app = "greeter"
version = "^1"

[appserver.messaging_acl]
may_call = ["greeter"]
